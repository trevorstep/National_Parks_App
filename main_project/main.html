<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Track your visits to National Parks across the USA! Log your memories for every trip along the way!">
  <title>National Parks Tracker</title>
  <link rel="stylesheet" href="https://js.arcgis.com/4.32/esri/themes/light/main.css">
  <link rel="stylesheet" href="styles/styles.css">
</head>

<body>
  <header>
    <div class="loader"></div>
    <div class="header-content">
      <h1>National Parks Tracker</h1>
      <p>Explore and track your visits to America's National Parks</p>
    </div>
    <div id="auth-container">
      <button id="login-btn" style="display: none;">Sign in with Google</button>
      <div id="user-info" style="display: none;">
        <span id="user-name"></span>
        <button id="logout-btn">Sign Out</button>
      </div>
    </div>
  </header>

  <main>
    <div class="progress">
      <div class="progress-done" id="progress-bar"></div>
      <div class="progress-text" id="progress-text">0%</div>
    </div>

    <div id="viewDiv"></div>

    <form>
      <label for="search">
        <input type="text" id="search" name="Search" placeholder="Search...">
        <button> <img id="searching" src="images/parks/search.svg" alt="Search button"></button>
      </label>
    </form>
    <hr>

    <div id="parks-container"></div>

  </main>

      <footer>
        <a href="logMemories.html">Log memories</a>
        <p>&copy; 2025</p>
    </footer>
  <script type="module" src="scripts/index.js"></script>
</body>

</html>
